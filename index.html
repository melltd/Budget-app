<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Budget"><meta name="theme-color" content="#2f7d6b">
<title>Mon budget</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eff4f1;--card:#fff;--ink:#1d2a27;--mut:#63766f;--line:#dbe5e0;--acc:#2f7d6b;--accbg:#e3f1ec;--ok:#4da583;--warn:#e0a03c;--over:#c98a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2522;--ink:#e6eeeb;--mut:#93a8a0;--line:#2a3833;--acc:#5fc0a5;--accbg:#22362f}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2522;--ink:#e6eeeb;--mut:#93a8a0;--line:#2a3833;--acc:#5fc0a5;--accbg:#22362f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h2{font-size:1.35rem;margin:6px 0 12px}h3{font-size:1rem;margin:0 0 10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
small,.m{color:var(--mut);font-size:.85rem}
.big{font-size:1.9rem;font-weight:700;color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:6px}
input,textarea{width:100%;padding:11px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;font-size:.8rem}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;margin:0 6px 6px 0}
.btn.s{background:var(--accbg);color:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:1.3rem;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nv button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:1.1rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:13px 2px;color:var(--mut);font-size:.82rem;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.lg{display:flex;align-items:center;gap:6px;font-size:.85rem;margin:2px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.sc{overflow-x:auto}
#t{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#t.show{opacity:1}
</style></head><body>
<main id="v"></main><div id="t"></div>
<nav id="nav"></nav>
<script>
const K='budget-v1',PAL=['#2f7d6b','#7b6fd0','#d98a3d','#4a90c2','#c26a8c','#8fa63a','#6b7c77','#b08a5a'],
PAY=['Carte Revolut','Autre compte','Espèces','Paiement en 4X'],
TABS=['Mois','Ajouter','4X','Épargne','Données'],
G=[[/carrefour|monoprix|auchan|leclerc|lidl|franprix|intermarch/i,'Courses'],[/tcl|sncf|navigo/i,'Transport'],[/pharma|^dr |docteur|novavet|veto|vétéri/i,'Santé et véto'],[/botanic|^but|strene|ikea|action|leroy/i,'Shopping et maison'],[/esso|shell|carburant|station/i,'Essence'],[/kfc|beers|smash|gaufres|tartine|phie|mcdo|restaurant|cin[eé]/i,'Plaisir']];
const $=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,9),
sum=a=>a.reduce((x,y)=>x+y,0),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fmt=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €',
p2=n=>String(n).padStart(2,'0'),
td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},
cur=()=>td().slice(0,7),
mn=(m,o)=>{const[y,k]=m.split('-');return new Date(y,k-1,1).toLocaleDateString('fr-FR',o||{month:'long',year:'numeric'})},
addM=(m,n)=>{let[y,k]=m.split('-').map(Number);k+=n;y+=Math.floor((k-1)/12);k=(((k-1)%12)+12)%12+1;return y+'-'+p2(k)},
toast=m=>{const t=$('t');t.textContent=m;t.className='show';setTimeout(()=>t.className='',1800)};
let S={cats:{'Courses':0,'Plaisir':0,'Santé et véto':0,'Shopping et maison':0,'Transport':0,'Essence':0,'Imprévus':0,'Paiements en 4X':0},exp:[],
fx:[],sav:{},goal:0};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab=0,vm=cur(),F={id:null,a:'',d:td(),c:'Courses',p:'Carte Revolut',n:''},armed=0;
const col=c=>PAL[Math.max(0,Object.keys(S.cats).indexOf(c))%PAL.length];
const bc=r=>r>1?'var(--over)':r>.8?'var(--warn)':'var(--ok)';
const bar=(s,b)=>{const r=b>0?s/b:0;return `<div class="bar"><i style="width:${Math.min(r,1)*100}%;background:${bc(r)}"></i></div>`};

function auto(){let ch=0;const c=cur();S.fx.forEach(f=>{while(f.left>0&&f.last<c){f.last=addM(f.last,1);f.left--;S.exp.push({id:uid(),d:f.last===c?td():f.last+'-01',a:f.a,c:'Paiements en 4X',p:'Paiement en 4X',n:f.n});ch=1}});if(ch)save()}

function vMois(){
 const ex=S.exp.filter(e=>e.d.startsWith(vm)),by={};Object.keys(S.cats).forEach(c=>by[c]=0);ex.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);
 const env=sum(Object.values(S.cats)),tot=sum(ex.map(e=>e.a)),left=env-tot,isCur=vm===cur(),n=new Date(),
 dl=isCur?new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1:0,cs=Object.keys(S.cats);
 const ins=[],cn=cs.filter(c=>c!=='Paiements en 4X'&&S.cats[c]>0),over=cn.filter(c=>by[c]>S.cats[c]);
 if(over.length)ins.push(`${over[0]} : enveloppe dépassée de ${fmt(by[over[0]]-S.cats[over[0]])}. Rien de grave, on rééquilibre le mois suivant.`);
 const near=cn.filter(c=>by[c]>0&&by[c]<=S.cats[c]).sort((a,b)=>by[b]/S.cats[b]-by[a]/S.cats[a])[0];
 if(near){const l=S.cats[near]-by[near];ins.push(near==='Plaisir'?`Plaisir : il te reste ${fmt(l)} à dépenser sans culpabilité.`:`${near} : ${Math.round(by[near]/S.cats[near]*100)} % utilisés, il reste ${fmt(l)}${dl?` pour ${dl} jour${dl>1?'s':''}`:''}.`)}
 if(!env){ins.length=0;ins.push('Règle d’abord tes enveloppes dans l’onglet Données.')}
 if(!ins.length)ins.push('Aucune dépense ce mois-ci : ajoute la première dans l’onglet Ajouter.');
 let off=0;const C=2*Math.PI*38,used=cs.filter(c=>by[c]>0);
 const arcs=used.map(c=>{const l=by[c]/tot*C,s=`<circle r="38" cx="50" cy="50" fill="none" stroke="${col(c)}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
 const ms=[0,1,2,3,4,5].map(i=>addM(vm,i-5)),tt=ms.map(m=>sum(S.exp.filter(e=>e.d.startsWith(m)).map(e=>e.a))),mx=Math.max(env,...tt)*1.08,
 bars=ms.map((m,i)=>{const h=tt[i]/mx*90,x=i*50+12;return `<rect x="${x}" y="${100-h}" width="30" height="${h}" rx="5" fill="var(--acc)" opacity="${m===vm?1:.45}"/><text x="${x+15}" y="114" font-size="10" text-anchor="middle" fill="var(--mut)">${mn(m,{month:'short'})}</text>${tt[i]?`<text x="${x+15}" y="${96-h}" font-size="9" text-anchor="middle" fill="var(--mut)">${Math.round(tt[i])}</text>`:''}`}).join(''),
 ly=100-env/mx*90,top=[...ex].sort((a,b)=>b.a-a.a).slice(0,5);
 return `<div class="nv"><button onclick="vm=addM(vm,-1);R()">‹</button><h2 style="margin:0;text-transform:capitalize">${mn(vm)}</h2><button onclick="vm=addM(vm,1);R()">›</button></div>
 <div class="c"><small>${left>=0?'Il te reste à dépenser':'Enveloppes dépassées de'}</small><div class="big">${fmt(Math.abs(left))}</div>
 <small>${isCur&&left>0?`soit environ ${fmt(left/dl)} par jour pendant ${dl} jour${dl>1?'s':''}`:`${fmt(tot)} dépensés sur ${fmt(env)}`}</small>${bar(tot,env)}</div>
 <div class="c">${ins.map(t=>`<div style="margin:4px 0">${esc(t)}</div>`).join('')}</div>
 <div class="c"><h3>Enveloppes</h3>${cs.map(c=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between"><span>${c}</span><span class="m">${fmt(by[c])} sur ${fmt(S.cats[c])}</span></div>${c==='Plaisir'?'<small>à dépenser sans culpabilité</small>':''}${bar(by[c],S.cats[c])}</div>`).join('')}</div>
 <div class="c"><h3>Répartition</h3>${tot?`<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 100 100" width="130" height="130">${arcs}</svg><div>${used.map(c=>`<div class="lg"><i style="background:${col(c)}"></i>${c} ${Math.round(by[c]/tot*100)} %</div>`).join('')}</div></div>`:'<small>Rien à afficher pour l’instant.</small>'}</div>
 <div class="c"><h3>6 derniers mois</h3><svg viewBox="0 0 300 120" width="100%"><line x1="0" x2="300" y1="${ly}" y2="${ly}" stroke="var(--mut)" stroke-dasharray="4 4" opacity=".6"/>${bars}</svg><small>Trait pointillé : total de tes enveloppes.</small></div>
 <div class="c"><h3>Top 5 des dépenses</h3>${top.length?top.map(e=>`<div class="row"><span>${esc(e.n||e.c)}<br><small>${e.d.slice(8)}/${e.d.slice(5,7)}, ${e.c}</small></span><b>${fmt(e.a)}</b></div>`).join(''):'<small>Aucune dépense.</small>'}</div>`}

function vAjout(){
 const ex=S.exp.filter(e=>e.d.startsWith(vm)).sort((a,b)=>b.d.localeCompare(a.d));
 return `<h2>${F.id?'Modifier la dépense':'Nouvelle dépense'}</h2><div class="c">
 <input type="text" inputmode="decimal" placeholder="Montant en €" value="${esc(F.a)}" oninput="F.a=this.value" style="font-size:1.3rem;font-weight:600">
 <div class="chips">${Object.keys(S.cats).map(c=>`<button class="chip${F.c===c?' on':''}" onclick="F.c='${c}';R()">${c}</button>`).join('')}</div>
 <div class="chips">${PAY.map(p=>`<button class="chip${F.p===p?' on':''}" onclick="F.p='${p}';R()">${p}</button>`).join('')}</div>
 <input type="date" value="${F.d}" onchange="F.d=this.value"><input type="text" placeholder="Note (facultatif)" value="${esc(F.n)}" oninput="F.n=this.value">
 <button class="btn" onclick="add()">${F.id?'Enregistrer':'Ajouter'}</button>${F.id?'<button class="btn s" onclick="F={id:null,a:\'\',d:td(),c:F.c,p:F.p,n:\'\'};R()">Annuler</button>':''}</div>
 <div class="c"><h3>Dépenses de ${mn(vm)}</h3>${ex.length?ex.map(e=>`<div class="row" onclick="edit('${e.id}')" style="cursor:pointer"><span>${esc(e.n||e.c)}<br><small>${e.d.slice(8)}/${e.d.slice(5,7)}, ${e.c}, ${e.p}</small></span><span><b>${fmt(e.a)}</b><button class="x" onclick="event.stopPropagation();del('${e.id}')" aria-label="Supprimer">×</button></span></div>`).join(''):'<small>Aucune dépense ce mois-ci. Touche une ligne pour la modifier.</small>'}</div>`}

function add(){const a=parseFloat(String(F.a).replace(',','.'));if(!(a>0)){toast('Entre un montant.');return}
 const o={id:F.id||uid(),d:F.d||td(),a,c:F.c,p:F.p,n:F.n.trim()};
 if(F.id)S.exp=S.exp.map(e=>e.id===F.id?o:e);else S.exp.push(o);
 save();vm=o.d.slice(0,7);toast(F.id?'Modifié':'Ajouté');F={id:null,a:'',d:td(),c:F.c,p:F.p,n:''};R()}
function edit(id){const e=S.exp.find(x=>x.id===id);F={id,a:String(e.a),d:e.d,c:e.c,p:e.p,n:e.n||''};R();scrollTo(0,0)}
function del(id){S.exp=S.exp.filter(e=>e.id!==id);save();toast('Supprimé');R()}

function v4x(){const act=S.fx.filter(f=>f.left>0),end=act.map(f=>addM(f.last,f.left)).sort().pop();
 return `<h2>Paiements en 4X</h2><div class="c"><small>Encore à venir chaque mois</small><div class="big">${fmt(sum(act.map(f=>f.a)))}</div>
 <small>${act.length?`Total restant ${fmt(sum(act.map(f=>f.a*f.left)))}, dernière échéance en ${mn(end)}.`:'Tout est soldé, bravo : ce budget est libéré pour l’épargne.'}</small></div>
 <div class="c">${S.fx.length?S.fx.map(f=>`<div class="row"><span>${esc(f.n)}<br><small>${f.left>0?`${fmt(f.a)} par mois, ${f.left} échéance${f.left>1?'s':''} restante${f.left>1?'s':''}, fin en ${mn(addM(f.last,f.left))}`:'Soldé'}</small></span><button class="x" onclick="S.fx=S.fx.filter(x=>x.id!=='${f.id}');save();R()" aria-label="Supprimer">×</button></div>`).join(''):'<small>Aucun paiement en 4X suivi.</small>'}</div>
 <div class="c"><h3>Ajouter un achat en 4X</h3><input id="fn" placeholder="Nom"><input id="fa" inputmode="decimal" placeholder="Montant par échéance"><input id="fl" inputmode="numeric" placeholder="Échéances restantes (avec celle de ce mois)" value="4">
 <button class="btn" onclick="addFx()">Ajouter</button><br><small>L’échéance de ce mois est comptée tout de suite, les suivantes s’ajoutent seules chaque mois.</small></div>`}
function addFx(){const a=parseFloat($('fa').value.replace(',','.')),l=parseInt($('fl').value);if(!(a>0)||!(l>0)){toast('Montant et échéances requis.');return}
 const n=$('fn').value.trim()||'Achat en 4X';S.fx.push({id:uid(),n,a,left:l-1,last:cur()});S.exp.push({id:uid(),d:td(),a,c:'Paiements en 4X',p:'Paiement en 4X',n});save();toast('Ajouté');R()}

function vEp(){const m=cur(),mo=S.sav[m]||0,g=S.goal,r=g>0?mo/g:0;
 return `<h2>Épargne</h2><div class="c"><small>Mis de côté en ${mn(m)}</small><div class="big">${fmt(mo)}</div>
 <div class="bar"><i style="width:${Math.min(r,1)*100}%;background:var(--ok)"></i></div><small>${Math.round(r*100)} % de ton objectif de ${fmt(g)}</small></div>
 <div class="c"><small>Total cumulé</small><div class="big">${fmt(sum(Object.values(S.sav)))}</div></div>
 <div class="c"><h3>Mettre de côté</h3><input id="sa" inputmode="decimal" placeholder="Montant en €"><button class="btn" onclick="addSav()">Ajouter à l’épargne</button><small>Un montant négatif retire de l’épargne.</small></div>
 <div class="c"><h3>Objectif mensuel</h3><input inputmode="decimal" value="${S.goal}" onchange="S.goal=parseFloat(this.value.replace(',','.'))||0;save();R()">
 <small>Modifie ce montant quand tes charges changent, par exemple quand un 4X se termine.</small></div>`}
function addSav(){const a=parseFloat($('sa').value.replace(',','.'));if(!a){toast('Entre un montant.');return}const m=cur();S.sav[m]=(S.sav[m]||0)+a;save();toast('Épargne mise à jour');R()}

function vDon(){return `<h2>Données</h2><div class="c"><h3>Enveloppes mensuelles</h3>${Object.keys(S.cats).map(c=>`<div class="row"><span>${c}</span><input style="width:110px;margin:0;text-align:right" inputmode="decimal" value="${S.cats[c]}" onchange="S.cats['${c}']=parseFloat(this.value.replace(',','.'))||0;save();toast('Enregistré')"></div>`).join('')}<small>Les charges fixes (loyer, assurances, abonnements…) sont hors de l’app : ne mets ici que tes dépenses variables.</small></div>
 <div class="c"><h3>Export et import CSV</h3><textarea id="csv" placeholder="Colle ici un CSV, ou touche Exporter pour obtenir le tien"></textarea>
 <input type="file" accept=".csv,text/csv,text/plain" onchange="const f=this.files[0];if(f){const r=new FileReader();r.onload=()=>{$('csv').value=r.result;toast('Fichier chargé : touche Importer')};r.readAsText(f)}">
 <button class="btn" onclick="expCsv()">Exporter</button><button class="btn s" onclick="impCsv()">Importer</button><br>
 <small>Import d’un relevé Revolut : seules les sorties sont prises, les virements et les 4X sont ignorés (déjà suivis ailleurs), et les catégories sont devinées.</small></div>
 <div class="c"><button class="btn s" onclick="if(armed){S.exp=[];S.sav={};save();armed=0;toast('Dépenses effacées')}else{armed=1;toast('Touche encore pour confirmer')}R()">${armed?'Confirmer : tout effacer':'Réinitialiser mes dépenses'}</button></div>`}
function expCsv(){const t='date;montant;categorie;paiement;note\n'+S.exp.map(e=>[e.d,e.a,e.c,e.p,(e.n||'').replace(/;/g,',')].join(';')).join('\n');$('csv').value=t;$('csv').select();try{navigator.clipboard.writeText(t)}catch(e){}toast('CSV prêt à copier')}
function impCsv(){const t=$('csv').value.trim();if(!t){toast('Rien à importer.');return}
 const L=t.split(/\r?\n/),dl=(L[0].match(/;/g)||[]).length>(L[0].match(/,/g)||[]).length?';':',';
 const sp=l=>{const r=[];let c='',q=0;for(const h of l){if(h=='"')q=!q;else if(h==dl&&!q){r.push(c);c=''}else c+=h}r.push(c);return r.map(x=>x.trim())};
 const H=sp(L[0]).map(h=>h.toLowerCase()),ix=re=>H.findIndex(h=>re.test(h)),iD=ix(/date/),iA=ix(/amount|montant/),iN=ix(/desc|note/),iC=ix(/cat/),iP=ix(/paie|pay|moyen/);
 if(iD<0||iA<0){toast('Colonnes date et montant introuvables.');return}
 let ok=0,sk=0;
 L.slice(1).forEach(l=>{const r=sp(l);let a=parseFloat((r[iA]||'').replace(/\s/g,'').replace(',','.'));if(!a){sk++;return}
  let d=(r[iD]||'').trim();const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);d=m?`${m[3]}-${m[2]}-${m[1]}`:d.slice(0,10);
  const n=iN>=0?r[iN]||'':'';let c=iC>=0&&S.cats[r[iC]]?r[iC]:null;
  if(iC<0){if(a>=0||/^to |virement|paiement en 4x|4x/i.test(n)){sk++;return}}
  a=Math.abs(a);if(!c){const g=G.find(x=>x[0].test(n));c=g?g[1]:'Imprévus'}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||S.exp.some(e=>e.d===d&&e.a===a&&(e.n||'')===n)){sk++;return}
  S.exp.push({id:uid(),d,a,c,p:iP>=0&&r[iP]?r[iP]:'Carte Revolut',n});ok++});
 save();toast(`${ok} importée${ok>1?'s':''}, ${sk} ignorée${sk>1?'s':''}`)}

const V=[vMois,vAjout,v4x,vEp,vDon];
function R(){$('v').innerHTML=V[tab]();$('nav').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};armed=0;R();scrollTo(0,0)">${t}</button>`).join('')}
auto();R();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>

<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Budget"><meta name="theme-color" content="#4DB1FF">
<title>Mon budget</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#191835;--mut:#6b7684;--line:#e2e8f5;--acc:#0081E6;--accbg:#e5f2ff;--onacc:#fff;--ok:#1a90ec;--warn:#f2a93b;--over:#e08a4e;--f:Figtree,system-ui,sans-serif;--d:Figtree,system-ui,sans-serif;--grad:linear-gradient(135deg,#7876FD,#4DB1FF);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191835;--card:#23214a;--ink:#f2f4ff;--mut:#9ba6b6;--line:#34326a;--acc:#4DB1FF;--accbg:#2a3a68;--onacc:#191835;--ok:#4DB1FF;--warn:#f2b354;--over:#e8985a}}
:root[data-theme="dark"]{--bg:#191835;--card:#23214a;--ink:#f2f4ff;--mut:#9ba6b6;--line:#34326a;--acc:#4DB1FF;--accbg:#2a3a68;--onacc:#191835;--ok:#4DB1FF;--warn:#f2b354;--over:#e8985a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
main{max-width:560px;margin:0 auto;padding:12px 16px 104px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font:700 1.2rem var(--d);color:var(--acc);letter-spacing:.01em}
.tg{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.tg svg{width:20px;height:20px}
h2{font:700 1.5rem/1.2 var(--d);margin:10px 0 14px}h3{font-size:1rem;font-weight:700;margin:0 0 10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
small,.m{color:var(--mut);font-size:.85rem}
.big{font:700 2.1rem/1.1 var(--d);color:var(--acc)}
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:124px;height:124px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 1.15rem var(--d);text-align:center;padding:0 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px}
input,textarea{width:100%;padding:12px 14px;margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
textarea{min-height:110px;font-size:.8rem}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--grad);color:#191835;border:0;border-radius:12px;padding:12px 18px;font-weight:700;margin:0 6px 6px 0}
.btn.s{background:var(--accbg);color:var(--acc)}
.x{background:none;border:0;color:var(--mut);font-size:1.3rem;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 13px;font-size:.88rem}
.chip.on{background:var(--grad);border-color:transparent;color:#191835;font-weight:600}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nv button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:42px;height:38px;font-size:1.1rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;border-radius:14px;padding:10px 2px;color:var(--mut);font-size:.82rem;font-weight:600}
nav button.on{background:var(--accbg);color:var(--acc)}
.lg{display:flex;align-items:center;gap:6px;font-size:.85rem;margin:2px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
#t{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
#t.show{opacity:1}
</style></head><body>
<main id="v"></main><div id="t"></div>
<nav id="nav"></nav>
<script>
const K='budget-v1',PAL=['#3aa3f5','#7876fd','#f2a93b','#27c4a0','#e0659f','#9ab83a','#77838f','#a49bff'],
PAY=['Carte Revolut','Autre compte','Espèces','Paiement en 4X'],
TABS=['Mois','Ajouter','Auto','Épargne','Données'],
G=[[/carrefour|monoprix|auchan|leclerc|lidl|franprix|intermarch/i,'Courses'],[/tcl|sncf|navigo/i,'Transport'],[/pharma|^dr |docteur|novavet|veto|vétéri/i,'Santé et véto'],[/botanic|^but|strene|ikea|action|leroy/i,'Shopping et maison'],[/esso|shell|carburant|station/i,'Essence'],[/kfc|beers|smash|gaufres|tartine|phie|mcdo|restaurant|cin[eé]/i,'Plaisir']];
const $=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,9),
sum=a=>a.reduce((x,y)=>x+y,0),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fmt=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €',
p2=n=>String(n).padStart(2,'0'),
td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},
cur=()=>td().slice(0,7),
mn=(m,o)=>{const[y,k]=m.split('-');return new Date(y,k-1,1).toLocaleDateString('fr-FR',o||{month:'long',year:'numeric'})},
addM=(m,n)=>{let[y,k]=m.split('-').map(Number);k+=n;y+=Math.floor((k-1)/12);k=(((k-1)%12)+12)%12+1;return y+'-'+p2(k)},
toast=m=>{const t=$('t');t.textContent=m;t.className='show';setTimeout(()=>t.className='',1800)};
let S={cats:{'Courses':0,'Plaisir':0,'Santé et véto':0,'Shopping et maison':0,'Transport':0,'Essence':0,'Imprévus':0,'Paiements en 4X':0},exp:[],
fx:[],sav:{},goal:0,fixed:[],bh:{},rec:[],rev:[],ir:[],theme:'auto',ob:null};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab=0,vm=cur(),F={id:null,a:'',d:td(),c:'Courses',p:'Carte Revolut',n:''},armed=0,RF={n:'',a:'',d:'1',c:''},RI={n:'',a:'',d:'1'},RV={a:'',n:''};
const col=c=>PAL[Math.max(0,Object.keys(S.cats).indexOf(c))%PAL.length];
const B=(c,m)=>{let v=S.cats[c]||0;(S.bh[c]||[]).forEach(([k,x])=>{if(k<=m)v=x});return v},isF=c=>S.fixed.includes(c),LOCK='Paiements en 4X';
const PEND=m=>m===cur()?sum(S.ir.filter(r=>r.last<m).map(r=>r.a)):0,INC=m=>sum(S.rev.filter(e=>e.d.startsWith(m)).map(e=>e.a))+PEND(m);
const NET=m=>INC(m)-sum(S.exp.filter(e=>e.d.startsWith(m)).map(e=>e.a))-(S.sav[m]||0);
const OPEN=m=>{if(!S.ob||m<S.ob.m)return null;let v=S.ob.v,k=S.ob.m;while(k<m){v+=NET(k);k=addM(k,1)}return v};
const SOFAR=()=>{const m=cur(),t=td();return sum(S.rev.filter(e=>e.d.startsWith(m)&&e.d<=t).map(e=>e.a))-sum(S.exp.filter(e=>e.d.startsWith(m)&&e.d<=t).map(e=>e.a))-(S.sav[m]||0)};
const BAL=()=>{const o=OPEN(cur());return o===null?null:Math.round((o+SOFAR())*100)/100};
const bc=r=>r>1?'var(--over)':r>.8?'var(--warn)':'var(--ok)';
const bar=(s,b)=>{const r=b>0?s/b:0;return `<div class="bar"><i style="width:${Math.min(r,1)*100}%;background:${bc(r)}"></i></div>`};

function auto(){let ch=0;const c=cur();S.fx.forEach(f=>{while(f.left>0&&f.last<c){f.last=addM(f.last,1);f.left--;S.exp.push({id:uid(),d:f.last===c?td():f.last+'-01',a:f.a,c:'Paiements en 4X',p:'Paiement en 4X',n:f.n});ch=1}});
 (S.ir||[]).forEach(r=>{for(;;){const m=addM(r.last,1),d=m+'-'+p2(r.day);if(m>c||(m===c&&d>td()))break;S.rev.push({id:uid(),d,a:r.a,n:r.n});r.last=m;ch=1}});
 (S.rec||[]).forEach(r=>{for(;;){const m=addM(r.last,1),d=m+'-'+p2(r.day);if(m>c||(m===c&&d>td()))break;S.exp.push({id:uid(),d,a:r.a,c:r.c,p:'Automatique',n:r.n});r.last=m;ch=1}});if(ch)save()}

function vMois(){
 const SC={};Object.keys(S.cats).forEach(c=>SC[c]=B(c,vm));const ex=S.exp.filter(e=>e.d.startsWith(vm)),by={};Object.keys(S.cats).forEach(c=>by[c]=0);ex.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);
 const cs=Object.keys(S.cats),vc=cs.filter(c=>!isF(c)),fc=cs.filter(isF),env=sum(vc.map(c=>SC[c])),tot=sum(vc.map(c=>by[c]||0)),envF=sum(fc.map(c=>SC[c])),totF=sum(fc.map(c=>by[c]||0)),envAll=env+envF,totAll=tot+totF,left=env-tot,isCur=vm===cur(),n=new Date(),
 dl=isCur?new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1:0;
 const ins=[],cn=vc.filter(c=>c!==LOCK&&SC[c]>0),over=cn.filter(c=>by[c]>SC[c]);
 if(over.length)ins.push(`${over[0]} : enveloppe dépassée de ${fmt(by[over[0]]-SC[over[0]])}. Rien de grave, on rééquilibre le mois suivant.`);
 const near=cn.filter(c=>by[c]>0&&by[c]<=SC[c]).sort((a,b)=>by[b]/SC[b]-by[a]/SC[a])[0];
 if(near){const l=SC[near]-by[near];ins.push(near==='Plaisir'?`Plaisir : il te reste ${fmt(l)} à dépenser sans culpabilité.`:`${near} : ${Math.round(by[near]/SC[near]*100)} % utilisés, il reste ${fmt(l)}${dl?` pour ${dl} jour${dl>1?'s':''}`:''}.`)}
 if(!env){ins.length=0;ins.push('Règle d’abord tes enveloppes dans l’onglet Données.')}
 if(!ins.length)ins.push('Aucune dépense ce mois-ci : ajoute la première dans l’onglet Ajouter.');
 const rw=c=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><span class="m">${fmt(by[c]||0)} sur ${fmt(SC[c])}</span></div>${c==='Plaisir'?'<small>à dépenser sans culpabilité</small>':''}${isF(c)&&SC[c]>0&&by[c]>=SC[c]?'<small>payé ✓</small>':''}${bar(by[c]||0,SC[c])}</div>`;const rr=env>0?Math.min(tot/env,1):0,RC=2*Math.PI*52;
 const inc=INC(vm),pd=PEND(vm),sv=S.sav[vm]||0,ut=totAll+sv,rs=inc-ut,bs=Math.max(inc,ut),sg=(v,c)=>`<i style="flex:none;width:${v/bs*100}%;background:${c}"></i>`,lp=(v,c,l)=>`<div class="lg"><i style="background:${c}"></i>${l} ${fmt(v)} (${Math.round(v/inc*100)} %)</div>`;
 const op=OPEN(vm),fin=op===null?null:op+rs,sd=fin===null?'':`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><small>Solde en début de mois</small> <b>${fmt(op)}</b><br><small>${vm===cur()?'Solde estimé en fin de mois':'Solde en fin de mois'}</small> <b style="color:${fin<0?'var(--over)':'var(--ok)'}">${fmt(fin)}</b>${fin<0?'<br><small>Il passerait en négatif : regarde les enveloppes pour rééquilibrer.</small>':''}</div>`;
 const jg=inc>0?`<div class="c"><h3>Tes revenus du mois</h3><div class="bar" style="display:flex;height:16px">${sg(totF,'#77838f')}${sg(tot,'#3aa3f5')}${sg(sv,'#7876fd')}</div><div style="margin-top:8px">${lp(totF,'#77838f','Charges fixes')}${lp(tot,'#3aa3f5','Dépenses variables')}${lp(sv,'#7876fd','Épargne')}</div><div style="margin-top:8px">${rs>=0?`Il te reste <b>${fmt(rs)}</b> sur ${fmt(inc)}${pd>0?` (dont ${fmt(pd)} encore à recevoir)`:''}.`:`Tu dépasses ton revenu de <b>${fmt(-rs)}</b> ce mois-ci. Regarde les enveloppes pour rééquilibrer.`}</div>${sd}</div>`:'<div class="c"><small>Ajoute tes revenus (salaire, CAF…) dans l’onglet Auto pour voir la jauge de ton mois.</small>'+sd+'</div>';
 let off=0;const C=2*Math.PI*38,used=cs.filter(c=>by[c]>0);
 const arcs=used.map(c=>{const l=by[c]/totAll*C,s=`<circle r="38" cx="50" cy="50" fill="none" stroke="${col(c)}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
 const ms=[0,1,2,3,4,5].map(i=>addM(vm,i-5)),tt=ms.map(m=>sum(S.exp.filter(e=>e.d.startsWith(m)).map(e=>e.a))),mx=Math.max(envAll,...tt)*1.08,
 bars=ms.map((m,i)=>{const h=tt[i]/mx*90,x=i*50+12;return `<rect x="${x}" y="${100-h}" width="30" height="${h}" rx="5" fill="var(--acc)" opacity="${m===vm?1:.45}"/><text x="${x+15}" y="114" font-size="10" text-anchor="middle" fill="var(--mut)">${mn(m,{month:'short'})}</text>${tt[i]?`<text x="${x+15}" y="${96-h}" font-size="9" text-anchor="middle" fill="var(--mut)">${Math.round(tt[i])}</text>`:''}`}).join(''),
 ly=100-envAll/mx*90,top=ex.filter(e=>!isF(e.c)).sort((a,b)=>b.a-a.a).slice(0,5);
 return `<div class="nv"><button onclick="vm=addM(vm,-1);R()">‹</button><h2 style="margin:0;text-transform:capitalize">${mn(vm)}</h2><button onclick="vm=addM(vm,1);R()">›</button></div>
 <div class="c hero"><div class="ring"><svg viewBox="0 0 124 124"><circle cx="62" cy="62" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="62" cy="62" r="52" fill="none" stroke="${bc(env>0?tot/env:0)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${rr*RC} ${RC}"/></svg><b>${fmt(Math.abs(left))}</b></div><div><small>${left>=0?'Il te reste pour tes dépenses variables':'Enveloppes variables dépassées de'}</small><div style="margin:4px 0">${isCur&&left>0?`soit environ ${fmt(left/dl)} par jour pendant ${dl} jour${dl>1?'s':''}`:`${fmt(tot)} dépensés sur ${fmt(env)}`}</div>${fc.length?`<small>Charges fixes : ${fmt(totF)} payées sur ${fmt(envF)}</small>`:''}</div></div>
 <div class="c">${ins.map(t=>`<div style="margin:4px 0">${esc(t)}</div>`).join('')}</div>
 ${jg}<div class="c"><h3>Dépenses variables</h3>${vc.map(rw).join('')||'<small>Aucune catégorie.</small>'}</div>${fc.length?`<div class="c"><h3>Charges fixes</h3>${fc.map(rw).join('')}</div>`:''}
 <div class="c"><h3>Répartition</h3>${totAll?`<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 100 100" width="130" height="130">${arcs}</svg><div>${used.map(c=>`<div class="lg"><i style="background:${col(c)}"></i>${esc(c)} ${Math.round(by[c]/totAll*100)} %</div>`).join('')}</div></div>`:'<small>Rien à afficher pour l’instant.</small>'}</div>
 <div class="c"><h3>6 derniers mois</h3><svg viewBox="0 0 300 120" width="100%"><line x1="0" x2="300" y1="${ly}" y2="${ly}" stroke="var(--mut)" stroke-dasharray="4 4" opacity=".6"/>${bars}</svg><small>Trait pointillé : total de tes enveloppes.</small></div>
 <div class="c"><h3>Top 5 des dépenses</h3>${top.length?top.map(e=>`<div class="row"><span>${esc(e.n||e.c)}<br><small>${e.d.slice(8)}/${e.d.slice(5,7)}, ${esc(e.c)}</small></span><b>${fmt(e.a)}</b></div>`).join(''):'<small>Aucune dépense.</small>'}</div>`}

function vAjout(){
 const ex=S.exp.filter(e=>e.d.startsWith(vm)).sort((a,b)=>b.d.localeCompare(a.d)),rv=S.rev.filter(e=>e.d.startsWith(vm)).sort((a,b)=>b.d.localeCompare(a.d));
 return `<h2>${F.id?'Modifier la dépense':'Nouvelle dépense'}</h2><div class="c">
 <input type="text" inputmode="decimal" placeholder="Montant en €" value="${esc(F.a)}" oninput="F.a=this.value" style="font-size:1.3rem;font-weight:600">
 <div class="chips">${Object.keys(S.cats).map((c,i)=>`<button class="chip${F.c===c?' on':''}" onclick="F.c=Object.keys(S.cats)[${i}];R()">${esc(c)}</button>`).join('')}</div>
 <div class="chips">${PAY.map(p=>`<button class="chip${F.p===p?' on':''}" onclick="F.p='${p}';R()">${p}</button>`).join('')}</div>
 <input type="date" value="${F.d}" onchange="F.d=this.value"><input type="text" placeholder="Note (facultatif)" value="${esc(F.n)}" oninput="F.n=this.value">
 <button class="btn" onclick="add()">${F.id?'Enregistrer':'Ajouter'}</button>${F.id?'<button class="btn s" onclick="F={id:null,a:\'\',d:td(),c:F.c,p:F.p,n:\'\'};R()">Annuler</button>':''}</div>
 <div class="c"><h3>Dépenses de ${mn(vm)}</h3>${ex.length?ex.map(e=>`<div class="row" onclick="edit('${e.id}')" style="cursor:pointer"><span>${esc(e.n||e.c)}<br><small>${e.d.slice(8)}/${e.d.slice(5,7)}, ${esc(e.c)}, ${e.p}</small></span><span><b>${fmt(e.a)}</b><button class="x" onclick="event.stopPropagation();del('${e.id}')" aria-label="Supprimer">×</button></span></div>`).join(''):'<small>Aucune dépense ce mois-ci. Touche une ligne pour la modifier.</small>'}</div>
 <div class="c"><h3>Revenus de ${mn(vm)}</h3>${rv.length?rv.map(e=>`<div class="row"><span>${esc(e.n)}<br><small>${e.d.slice(8)}/${e.d.slice(5,7)}</small></span><span><b>${fmt(e.a)}</b><button class="x" onclick="delRev('${e.id}')" aria-label="Supprimer">×</button></span></div>`).join(''):'<small>Aucun revenu enregistré ce mois-ci.</small>'}
 <div style="margin-top:10px"><small>Ajouter un revenu ponctuel</small></div><input inputmode="decimal" placeholder="Montant en €" value="${esc(RV.a)}" oninput="RV.a=this.value"><input placeholder="Note (ex. remboursement)" value="${esc(RV.n)}" oninput="RV.n=this.value"><button class="btn s" onclick="addRev()">Ajouter le revenu</button></div>`}

function add(){const a=parseFloat(String(F.a).replace(',','.'));if(!(a>0)){toast('Entre un montant.');return}
 const o={id:F.id||uid(),d:F.d||td(),a,c:F.c,p:F.p,n:F.n.trim()};
 if(F.id)S.exp=S.exp.map(e=>e.id===F.id?o:e);else S.exp.push(o);
 save();vm=o.d.slice(0,7);toast(F.id?'Modifié':'Ajouté');F={id:null,a:'',d:td(),c:F.c,p:F.p,n:''};R()}
function edit(id){const e=S.exp.find(x=>x.id===id);F={id,a:String(e.a),d:e.d,c:e.c,p:e.p,n:e.n||''};R();scrollTo(0,0)}
function del(id){S.exp=S.exp.filter(e=>e.id!==id);save();toast('Supprimé');R()}

function vInc(){
 return `<h2>Revenus automatiques</h2><div class="c">${S.ir.length?S.ir.map((r,i)=>`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(r.n)}</b><br><small>le ${r.day} de chaque mois</small></div><div style="width:105px;text-align:right"><input style="margin:0 0 4px;text-align:right" inputmode="decimal" value="${r.a}" onchange="incA(${i},this.value)"><button class="x" onclick="incDel(${i})" aria-label="Supprimer">×</button></div></div>`).join('')+'<small>Un nouveau montant vaut pour les prochains mois, pas pour ceux déjà reçus.</small>':'<small>Aucun revenu automatique. Ajoute ton salaire, ta CAF… ils s’inscriront seuls chaque mois.</small>'}</div>
 <div class="c"><h3>Ajouter un revenu</h3><div class="chips">${['Salaire','APL','Prime activité'].map(x=>`<button class="chip${RI.n===x?' on':''}" onclick="RI.n='${x}';R()">${x}</button>`).join('')}</div><input placeholder="Nom" value="${esc(RI.n)}" oninput="RI.n=this.value"><input inputmode="decimal" placeholder="Montant en €" value="${esc(RI.a)}" oninput="RI.a=this.value"><input inputmode="numeric" placeholder="Jour du mois (1 à 28)" value="${esc(RI.d)}" oninput="RI.d=this.value">
 <button class="btn" onclick="addInc(1)">Ajouter dès ce mois</button><button class="btn s" onclick="addInc(0)">Dès le mois prochain</button><br><small>Choisis « dès le mois prochain » si tu as déjà saisi ce revenu ce mois-ci. Si ton salaire tombe en fin de mois, mets le 28.</small></div>`}
function addInc(now){const a=parseFloat(String(RI.a).replace(',','.')),d=parseInt(RI.d),n=RI.n.trim();
 if(!(a>0)||!(d>=1&&d<=28)||!n){toast('Nom, montant et jour (1 à 28) requis.');return}
 S.ir.push({id:uid(),n,a,day:d,last:now?addM(cur(),-1):cur()});RI={n:'',a:'',d:'1'};auto();save();toast('Ajouté');R()}
function incA(i,v){S.ir[i].a=parseFloat(String(v).replace(',','.'))||0;save();toast('Enregistré');R()}
function incDel(i){S.ir.splice(i,1);save();R()}
function addRev(){const a=parseFloat(String(RV.a).replace(',','.'));if(!(a>0)){toast('Entre un montant.');return}
 S.rev.push({id:uid(),d:vm===cur()?td():vm+'-01',a,n:RV.n.trim()||'Revenu ponctuel'});RV={a:'',n:''};save();toast('Revenu ajouté');R()}
function delRev(id){S.rev=S.rev.filter(e=>e.id!==id);save();R()}
function vRec(){const cs=Object.keys(S.cats).filter(c=>c!==LOCK);
 return `<h2>Charges fixes automatiques</h2><div class="c">${S.rec.length?S.rec.map((r,i)=>`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${esc(r.n||r.c)}</b><br><small>${esc(r.c)}, le ${r.day} de chaque mois</small></div><div style="width:105px;text-align:right"><input style="margin:0 0 4px;text-align:right" inputmode="decimal" value="${r.a}" onchange="recA(${i},this.value)"><button class="x" onclick="recDel(${i})" aria-label="Supprimer">×</button></div></div>`).join('')+'<small>Un nouveau montant vaut pour les prochains mois, pas pour ceux déjà inscrits.</small>':'<small>Aucune charge automatique. Ajoute ton loyer, ton assurance… elles s’inscriront seules chaque mois.</small>'}</div>
 <div class="c"><h3>Ajouter une charge fixe</h3><input placeholder="Nom (ex. Loyer)" value="${esc(RF.n)}" oninput="RF.n=this.value"><input inputmode="decimal" placeholder="Montant en €" value="${esc(RF.a)}" oninput="RF.a=this.value"><input inputmode="numeric" placeholder="Jour du mois (1 à 28)" value="${esc(RF.d)}" oninput="RF.d=this.value">
 ${cs.length?`<small>Catégorie (facultatif, sinon elle est créée avec le nom)</small><div class="chips" style="margin-top:6px">${cs.map((c,i)=>`<button class="chip${RF.c===c?' on':''}" onclick="RF.c=RF.c===Object.keys(S.cats).filter(x=>x!==LOCK)[${i}]?'':Object.keys(S.cats).filter(x=>x!==LOCK)[${i}];R()">${esc(c)}</button>`).join('')}</div>`:''}
 <button class="btn" onclick="addRec(1)">Ajouter dès ce mois</button><button class="btn s" onclick="addRec(0)">Dès le mois prochain</button><br><small>Choisis « dès le mois prochain » si tu as déjà saisi cette dépense ce mois-ci.</small></div>`}
function addRec(now){const a=parseFloat(String(RF.a).replace(',','.')),d=parseInt(RF.d),n=RF.n.trim();
 if(!(a>0)||!(d>=1&&d<=28)||!(n||RF.c)){toast('Nom, montant et jour (1 à 28) requis.');return}
 const c=RF.c||n;if(S.cats[c]===undefined){S.cats[c]=a;S.fixed.push(c)}
 S.rec.push({id:uid(),n:n||c,c,a,day:d,last:now?addM(cur(),-1):cur()});RF={n:'',a:'',d:'1',c:''};auto();save();toast('Ajoutée');R()}
function recA(i,v){S.rec[i].a=parseFloat(String(v).replace(',','.'))||0;save();toast('Enregistré');R()}
function recDel(i){S.rec.splice(i,1);save();R()}
function v4x(){const act=S.fx.filter(f=>f.left>0),end=act.map(f=>addM(f.last,f.left)).sort().pop();
 return `<h2>Paiements en 4X</h2><div class="c"><small>Encore à venir chaque mois</small><div class="big">${fmt(sum(act.map(f=>f.a)))}</div>
 <small>${act.length?`Total restant ${fmt(sum(act.map(f=>f.a*f.left)))}, dernière échéance en ${mn(end)}.`:'Tout est soldé, bravo : ce budget est libéré pour l’épargne.'}</small></div>
 <div class="c">${S.fx.length?S.fx.map(f=>`<div class="row"><span>${esc(f.n)}<br><small>${f.left>0?`${fmt(f.a)} par mois, ${f.left} échéance${f.left>1?'s':''} restante${f.left>1?'s':''}, fin en ${mn(addM(f.last,f.left))}`:'Soldé'}</small></span><button class="x" onclick="S.fx=S.fx.filter(x=>x.id!=='${f.id}');save();R()" aria-label="Supprimer">×</button></div>`).join(''):'<small>Aucun paiement en 4X suivi.</small>'}</div>
 <div class="c"><h3>Ajouter un achat en 4X</h3><input id="fn" placeholder="Nom"><input id="fa" inputmode="decimal" placeholder="Montant par échéance"><input id="fl" inputmode="numeric" placeholder="Échéances restantes (avec celle de ce mois)" value="4">
 <button class="btn" onclick="addFx()">Ajouter</button><br><small>L’échéance de ce mois est comptée tout de suite, les suivantes s’ajoutent seules chaque mois.</small></div>`}
function addFx(){const a=parseFloat($('fa').value.replace(',','.')),l=parseInt($('fl').value);if(!(a>0)||!(l>0)){toast('Montant et échéances requis.');return}
 const n=$('fn').value.trim()||'Achat en 4X';S.fx.push({id:uid(),n,a,left:l-1,last:cur()});S.exp.push({id:uid(),d:td(),a,c:'Paiements en 4X',p:'Paiement en 4X',n});save();toast('Ajouté');R()}

function vEp(){const m=cur(),mo=S.sav[m]||0,g=S.goal,r=g>0?mo/g:0;
 return `<h2>Épargne</h2><div class="c"><small>Mis de côté en ${mn(m)}</small><div class="big">${fmt(mo)}</div>
 <div class="bar"><i style="width:${Math.min(r,1)*100}%;background:var(--ok)"></i></div><small>${Math.round(r*100)} % de ton objectif de ${fmt(g)}</small></div>
 <div class="c"><small>Total cumulé</small><div class="big">${fmt(sum(Object.values(S.sav)))}</div></div>
 <div class="c"><h3>Mettre de côté</h3><input id="sa" inputmode="decimal" placeholder="Montant en €"><button class="btn" onclick="addSav()">Ajouter à l’épargne</button><small>Un montant négatif retire de l’épargne.</small></div>
 <div class="c"><h3>Objectif mensuel</h3><input inputmode="decimal" value="${S.goal}" onchange="S.goal=parseFloat(this.value.replace(',','.'))||0;save();R()">
 <small>Modifie ce montant quand tes charges changent, par exemple quand un 4X se termine.</small></div>`}
function addSav(){const a=parseFloat($('sa').value.replace(',','.'));if(!a){toast('Entre un montant.');return}const m=cur();S.sav[m]=(S.sav[m]||0)+a;save();toast('Épargne mise à jour');R()}

function vDon(){const cs=Object.keys(S.cats),m=cur(),sug=['Loyer','Assurance auto','Assurance habitation','Emprunt','Électricité','Abonnements'].filter(x=>!cs.includes(x));
 return `<h2>Données</h2><div class="c"><h3>Solde de tes comptes</h3><input placeholder="Ex. 320 ou -150" value="${BAL()===null?'':BAL()}" onchange="setBal(this.value)"><small>Additionne tes comptes. Mets un « - » devant si tu es à découvert. Recale-le de temps en temps avec ton vrai solde : l’appli le reporte ensuite de mois en mois et calcule ton solde de fin de mois.</small></div><div class="c"><h3>Apparence</h3><div class="chips" style="margin:0">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(x=>`<button class="chip${(S.theme||'auto')===x[0]?' on':''}" onclick="setTh('${x[0]}')">${x[1]}</button>`).join('')}</div><small>Auto suit le réglage de ton iPhone.</small></div><div class="c"><h3>Catégories et montants mensuels</h3>${cs.map((c,i)=>`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><input style="margin:0 0 6px" value="${esc(c)}" ${c===LOCK?'disabled':`onchange="renCat(${i},this.value)"`}><div class="chips" style="margin:0"><button class="chip${!isF(c)?' on':''}" onclick="setT(${i},0)">variable</button><button class="chip${isF(c)?' on':''}" onclick="setT(${i},1)">fixe</button></div></div><div style="width:105px;text-align:right"><input style="margin:0 0 4px;text-align:right" inputmode="decimal" value="${B(c,m)}" onchange="setB(${i},this.value)">${c===LOCK?'':`<button class="x" onclick="delCat(${i})" aria-label="Supprimer">×</button>`}</div></div>`).join('')}
 <small>Fixe : loyer, assurances, emprunt, abonnements. Variable : le reste. Quand un montant change (par exemple l’assurance habitation), la modification vaut à partir de ce mois : les mois passés gardent l’ancien montant.</small></div>
 <div class="c"><h3>Ajouter une catégorie</h3>${sug.length?`<div class="chips">${sug.map(x=>`<button class="chip" onclick="addCat('${x}',1)">+ ${x}</button>`).join('')}</div>`:''}
 <input id="nn" placeholder="Nom de la catégorie"><input id="nb" inputmode="decimal" placeholder="Montant mensuel en €">
 <button class="btn" onclick="addCat($('nn').value,0,$('nb').value)">Ajouter en variable</button><button class="btn s" onclick="addCat($('nn').value,1,$('nb').value)">Ajouter en fixe</button></div>
 <div class="c"><h3>Export et import CSV</h3><textarea id="csv" placeholder="Colle ici un CSV, ou touche Exporter pour obtenir le tien"></textarea>
 <input type="file" accept=".csv,text/csv,text/plain" onchange="const f=this.files[0];if(f){const r=new FileReader();r.onload=()=>{$('csv').value=r.result;toast('Fichier chargé : touche Importer')};r.readAsText(f)}">
 <button class="btn" onclick="expCsv()">Exporter</button><button class="btn s" onclick="impCsv()">Importer</button><br>
 <small>Import d’un relevé Revolut : seules les sorties sont prises, les virements et les 4X sont ignorés (déjà suivis ailleurs), et les catégories sont devinées.</small></div>
 <div class="c"><button class="btn s" onclick="if(armed){S.exp=[];S.sav={};save();armed=0;toast('Dépenses effacées')}else{armed=1;toast('Touche encore pour confirmer')}R()">${armed?'Confirmer : tout effacer':'Réinitialiser mes dépenses'}</button></div>`}

function setBal(v){v=String(v).replace(/[−–—]/g,'-').replace(',','.').replace(/\s/g,'');if(v===''){S.ob=null}else{const x=parseFloat(v);if(isNaN(x)){toast('Montant invalide.');return}S.ob={m:cur(),v:x-SOFAR()}}save();toast('Solde enregistré');R()}
function addCat(n,f,b){n=(n||'').trim();if(!n){toast('Donne un nom.');return}if(S.cats[n]!==undefined){toast('Cette catégorie existe déjà.');return}S.cats[n]=parseFloat(String(b||'').replace(',','.'))||0;if(f)S.fixed.push(n);save();toast('Catégorie ajoutée');R()}
function renCat(i,v){const o=Object.keys(S.cats)[i];v=v.trim();if(!v||v===o||o===LOCK)return;if(S.cats[v]!==undefined){toast('Ce nom existe déjà.');R();return}
 const N={};Object.keys(S.cats).forEach(k=>{N[k===o?v:k]=S.cats[k]});S.cats=N;S.exp.forEach(e=>{if(e.c===o)e.c=v});S.rec.forEach(r=>{if(r.c===o)r.c=v});S.fixed=S.fixed.map(x=>x===o?v:x);if(S.bh[o]){S.bh[v]=S.bh[o];delete S.bh[o]}if(F.c===o)F.c=v;save();toast('Renommée');R()}
function setT(i,f){const c=Object.keys(S.cats)[i];S.fixed=S.fixed.filter(x=>x!==c);if(f)S.fixed.push(c);save();R()}
function setB(i,val){const c=Object.keys(S.cats)[i],v=parseFloat(String(val).replace(',','.'))||0,m=cur();
 if(!S.cats[c]&&!(S.bh[c]||[]).length)S.cats[c]=v;else{S.bh[c]=(S.bh[c]||[]).filter(x=>x[0]!==m);S.bh[c].push([m,v]);S.bh[c].sort((x,y)=>x[0]<y[0]?-1:1)}save();toast('Enregistré');R()}
function delCat(i){const c=Object.keys(S.cats)[i];if(c===LOCK)return;if(S.exp.some(e=>e.c===c)||S.rec.some(r=>r.c===c)){toast('Cette catégorie est utilisée.');return}delete S.cats[c];S.fixed=S.fixed.filter(x=>x!==c);delete S.bh[c];if(F.c===c)F.c=Object.keys(S.cats)[0]||'';save();R()}
function expCsv(){const t='date;montant;categorie;paiement;note\n'+S.exp.map(e=>[e.d,e.a,e.c,e.p,(e.n||'').replace(/;/g,',')].join(';')).join('\n');$('csv').value=t;$('csv').select();try{navigator.clipboard.writeText(t)}catch(e){}toast('CSV prêt à copier')}
function impCsv(){const t=$('csv').value.trim();if(!t){toast('Rien à importer.');return}
 const L=t.split(/\r?\n/),dl=(L[0].match(/;/g)||[]).length>(L[0].match(/,/g)||[]).length?';':',';
 const sp=l=>{const r=[];let c='',q=0;for(const h of l){if(h=='"')q=!q;else if(h==dl&&!q){r.push(c);c=''}else c+=h}r.push(c);return r.map(x=>x.trim())};
 const H=sp(L[0]).map(h=>h.toLowerCase()),ix=re=>H.findIndex(h=>re.test(h)),iD=ix(/date/),iA=ix(/amount|montant/),iN=ix(/desc|note/),iC=ix(/cat/),iP=ix(/paie|pay|moyen/);
 if(iD<0||iA<0){toast('Colonnes date et montant introuvables.');return}
 let ok=0,sk=0;
 L.slice(1).forEach(l=>{const r=sp(l);let a=parseFloat((r[iA]||'').replace(/\s/g,'').replace(',','.'));if(!a){sk++;return}
  let d=(r[iD]||'').trim();const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);d=m?`${m[3]}-${m[2]}-${m[1]}`:d.slice(0,10);
  const n=iN>=0?r[iN]||'':'';let c=iC>=0&&S.cats[r[iC]]?r[iC]:null;
  if(iC<0){if(a>=0||/^to |virement|paiement en 4x|4x/i.test(n)){sk++;return}}
  a=Math.abs(a);if(!c){const g=G.find(x=>x[0].test(n));c=g?g[1]:'Imprévus'}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||S.exp.some(e=>e.d===d&&e.a===a&&(e.n||'')===n)){sk++;return}
  S.exp.push({id:uid(),d,a,c,p:iP>=0&&r[iP]?r[iP]:'Carte Revolut',n});ok++});
 save();toast(`${ok} importée${ok>1?'s':''}, ${sk} ignorée${sk>1?'s':''}`)}

const V=[vMois,vAjout,()=>vInc()+vRec()+v4x(),vEp,vDon];
const isDk=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyTh(){const r=document.documentElement;if(S.theme==='dark'||S.theme==='light')r.dataset.theme=S.theme;else delete r.dataset.theme}
function setTh(x){S.theme=x;save();applyTh();R()}
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const hd=()=>`<header class="hd"><span class="brand">Mon budget</span><button class="tg" onclick="setTh(isDk()?'light':'dark')" aria-label="Changer de thème">${isDk()?SUN:MOON}</button></header>`;
function R(){$('v').innerHTML=hd()+V[tab]();$('nav').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};armed=0;R();scrollTo(0,0)">${t}</button>`).join('')}
auto();applyTh();R();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){auto();R()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
